<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Login Page</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
      overflow:hidden;
    }

    .background{
      position:absolute;
      width:100%;
      height:100%;
      overflow:hidden;
      z-index:0;
    }

    .circle{
      position:absolute;
      border-radius:50%;
      background:rgba(255,255,255,0.1);
      animation:float 6s infinite ease-in-out;
    }

    .circle:nth-child(1){
      width:200px;
      height:200px;
      top:10%;
      left:10%;
    }

    .circle:nth-child(2){
      width:300px;
      height:300px;
      bottom:10%;
      right:10%;
      animation-delay:2s;
    }

    .circle:nth-child(3){
      width:120px;
      height:120px;
      bottom:20%;
      left:25%;
      animation-delay:4s;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-20px);
      }
    }

    .login-container{
      position:relative;
      z-index:1;
      width:380px;
      padding:40px;
      border-radius:20px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(15px);
      box-shadow:0 8px 32px rgba(0,0,0,0.25);
      border:1px solid rgba(255,255,255,0.2);
      color:white;
    }

    .login-container h2{
      text-align:center;
      margin-bottom:30px;
      font-size:32px;
      font-weight:600;
    }

    .input-group{
      margin-bottom:20px;
    }

    .input-group label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:none;
      outline:none;
      border-radius:12px;
      background:rgba(255,255,255,0.2);
      color:white;
      font-size:15px;
      transition:0.3s;
    }

    .input-group input::placeholder{
      color:#e5e5e5;
    }

    .input-group input:focus{
      background:rgba(255,255,255,0.3);
      transform:scale(1.02);
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      font-size:14px;
    }

    .options a{
      color:#fff;
      text-decoration:none;
    }

    .options a:hover{
      text-decoration:underline;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:white;
      color:#4f46e5;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 5px 15px rgba(0,0,0,0.3);
    }

    .register{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }

    .register a{
      color:#fff;
      font-weight:600;
      text-decoration:none;
    }

    .register a:hover{
      text-decoration:underline;
    }

    @media(max-width:450px){
      .login-container{
        width:90%;
        padding:30px;
      }
    }
  </style>
</head>
<body>

  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="login-container">
    <h2>Welcome Back</h2>

    <form>
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember me
        </label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <div class="register">
        Don't have an account?
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
